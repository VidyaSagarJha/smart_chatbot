<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Chat</title>
  <link rel="stylesheet" href="/static/styles.css?v=3">
</head>
<body>
  <main class="app-shell">
    <section class="app-card" aria-label="PDF chatbot">
      <header class="hero">
        <p class="eyebrow">DOCUMENT ASSISTANT</p>
        <h1>Chat with your PDFs</h1>
        <p class="subtitle">Upload one or more PDFs and ask questions across their contents.</p>
      </header>

      <section id="upload-section" class="upload-section">
        <label id="drop-zone" class="drop-zone" for="pdf-file">
          <span class="upload-icon">↑</span>
          <span class="upload-title">Choose PDFs</span>
          <span class="upload-description">Select or drop one or more PDF files</span>
          <input id="pdf-file" type="file" accept="application/pdf,.pdf" multiple>
        </label>
        <p id="upload-status" class="status" aria-live="polite"></p>
      </section>

      <section id="chat-section" class="chat-section" hidden>
        <div class="document-bar">
          <div>
            <p class="document-label">CURRENT PDF COLLECTION</p>
            <p id="document-name" class="document-name"></p>
          </div>
          <div class="document-actions">
            <button id="change-document" class="secondary-button" type="button">Change PDFs</button>
          </div>
        </div>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="question">Ask a question</label>
          <input id="question" type="text" placeholder="Ask something about your PDFs…" autocomplete="off" required>
          <button id="voice-button" class="voice-button" type="button" aria-label="Start voice command" title="Speak your question">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
              <path d="M19 11v1a7 7 0 0 1-14 0v-1M12 19v3M8 22h8"/>
            </svg>
          </button>
          <button id="send-button" type="submit">Send</button>
        </form>
        <p id="voice-status" class="voice-status" aria-live="polite"></p>
      </section>
    </section>
  </main>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
